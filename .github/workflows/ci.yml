name: CI

# `master` is this repo's default branch. This used to say `main`, so pushes to the branch
# everything actually lands on were never tested.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # package.json declares engines >= 20, so 20 has to be proven, not assumed. The npm test
        # script deliberately passes no path argument: `node --test` has walked the project for
        # test files since Node 18, whereas a quoted glob only expands on Node 22+ and simply
        # fails to resolve on 20.
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
