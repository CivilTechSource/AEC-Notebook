name: Release

# Push a version tag (e.g. v1.0.0) and this builds installers for all three platforms and
# attaches them to a GitHub Release. Installers are far too large for the git repo itself —
# Releases is where binaries belong.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:          # also runnable by hand from the Actions tab

permissions:
  contents: write             # needed to create the release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: 'dist/*.exe'
          - os: macos-latest
            artifact: 'dist/*.dmg'
          - os: ubuntu-latest
            artifact: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      # Never publish from the build step — the release job below owns that, so a failed
      # upload can't leave a half-published release behind.
      - run: npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true          # review the notes, then publish from the Releases page
          generate_release_notes: true
